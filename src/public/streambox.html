<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:transparent;color:white;font-family:monospace;font-size:16px;">
  <div id="feed"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io('https://ws.socketkill.com', {
      transports: ['websocket']
    });

    socket.on('connect', () => {
      const el = document.createElement('div');
      el.textContent = '[connected ' + socket.id + ']';
      document.getElementById('feed').prepend(el);
    });

    socket.on('connect_error', (err) => {
      const el = document.createElement('div');
      el.textContent = '[connect_error] ' + err.message;
      document.getElementById('feed').prepend(el);
    });

    socket.on('raw-kill', (kill) => {
      const line = document.createElement('div');
      line.textContent = kill.ship + ' in ' + kill.system + ' — ' + kill.val.toLocaleString() + ' ISK';
      document.getElementById('feed').prepend(line);
    });
  </script>
</body>
</html>
