<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <meta charset="utf-8">
  <style>
    :root {
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Exo 2', sans-serif;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: var(--font-body);
      overflow: hidden;
    }

    #feed {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 6px;
      padding: 12px;
      overflow: hidden;
    }

    .kill {
      display: flex;
      width: fit-content;
      min-width: 0;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.55);
      border-left: 3px solid #888;
      color: #e0e0e0;
      font-size: 15px;
      animation: slide 0.3s ease-out;
    }

    .kill.loss {
      border-left-color: #ff6b6b;
    }

    .kill.win {
      border-left-color: #51cf66;
    }

    .kill img {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .kill .meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .kill .ship {
      font-weight: bold;
      font-size: 13px;
      line-height: 1.2;
      max-width: 110px;
      overflow-wrap: break-word;
    }

    .kill .val {
      font-family: var(--font-mono);
      color: #ffd43b;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <div id="feed"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const showShip = params.get('ship') !== 'false';
    const character = params.get('character');
    const DEMO = params.get('demo') === '1';
    const MAX_ROWS = 12;
    const feed = document.getElementById('feed');

    function renderKill(k) {
      const row = document.createElement('div');
      row.className = k.isLoss ? 'kill loss' : 'kill win';
      row.innerHTML = `
        <img src="${k.shipImageUrl}" alt="">
        <div class="meta">
          ${showShip ? `<span class="ship">${k.ship}</span>` : ''}
          <span class="val">${humanizeIsk(k.val)} ISK</span>
        </div>
      `;
      feed.prepend(row);
      while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
    }

    function humanizeIsk(v) {
      if (v >= 1e12) return (v / 1e12).toFixed(2) + 't';
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'b';
      if (v >= 1e6) return (v / 1e6).toFixed(2) + 'm';
      if (v >= 1e3) return (v / 1e3).toFixed(2) + 'k';
      return String(v);
    }

    // ---- demo mode ----------------------------------------------------

    const DEMO_SHIPS = [
      { ship: 'Rifter', shipId: 587, val: 12_400_000 },
      { ship: 'Vexor Navy Issue', shipId: 17843, val: 340_000_000 },
      { ship: 'Loki', shipId: 29990, val: 2_100_000_000 },
      { ship: 'Venture', shipId: 32880, val: 900_000 },
      { ship: 'Nyx', shipId: 23913, val: 24_000_000_000 },
    ];

    function randomKill() {
      const s = DEMO_SHIPS[Math.floor(Math.random() * DEMO_SHIPS.length)];
      return {
        ...s,
        shipImageUrl: `https://images.evetech.net/types/${s.shipId}/render?size=64`,
        isLoss: Math.random() < 0.4,
      };
    }

    function makeMockSocket() {
      const handlers = {};
      const api = {
        on(evt, fn) { (handlers[evt] ||= []).push(fn); return api; },
        push(evt, data) { (handlers[evt] || []).forEach(fn => fn(data)); },
      };
      return api;
    }

    // ---- wiring -------------------------------------------------------

    const socket = DEMO
      ? makeMockSocket()
      : io('https://ws.socketkill.com', {
          query: { character },
          transports: ['websocket']
        });

    socket.on('char-kill', renderKill);

    if (DEMO) {
      const rate = Number(params.get('rate') || 1500);
      socket.push('char-kill', randomKill());
      setInterval(() => socket.push('char-kill', randomKill()), rate);
    }
  </script>
</body>

</html>
