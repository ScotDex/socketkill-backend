<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <meta charset="utf-8">
  <style>
    :root {
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Exo 2', sans-serif;
    }

    html {
      background: transparent;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: var(--font-body);
      overflow: hidden;
    }

    #feed {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 4px;
      padding: 10px;
      overflow: hidden;
    }

    .kill {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      width: 116px;
      box-sizing: border-box;
      background: rgba(10, 10, 12, 0.82);
      border-top: 2px solid #888;
      overflow: hidden;
      animation: slide 0.3s ease-out;
    }

    .kill.loss {
      border-top-color: #ff6b6b;
    }

    .kill.win {
      border-top-color: #51cf66;
    }

    .kill .thumb {
      width: 116px;
      height: 72px;
      object-fit: cover;
      display: block;
    }

    .kill .meta {
      padding: 5px 8px 6px;
      min-width: 0;
    }

    .kill .val {
      display: block;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      line-height: 1.15;
      color: #ffd43b;
      white-space: nowrap;
    }

    .kill .ship {
      display: block;
      font-size: 10px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      color: #9a9a9a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateX(-16px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <div id="feed"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const showShip = params.get('ship') !== 'false';
    const character = params.get('character');
    const DEMO = params.get('demo') === '1';
    const MAX_ROWS = 12;
    const feed = document.getElementById('feed');

    function renderKill(k) {
      const row = document.createElement('div');
      row.className = k.isLoss ? 'kill loss' : 'kill win';
      row.innerHTML = `
        <img class="thumb" src="${k.shipImageUrl}" alt="">
        <div class="meta">
          <span class="val">${humanizeIsk(k.val)}</span>
          ${showShip ? `<span class="ship">${k.ship}</span>` : ''}
        </div>
      `;
      feed.prepend(row);
      while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
    }

    function humanizeIsk(v) {
      if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
      if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
      return String(v);
    }

    // ---- demo mode ----------------------------------------------------

    const DEMO_SHIPS = [
      { ship: 'Rifter', shipId: 587, val: 12_400_000 },
      { ship: 'Vexor Navy Issue', shipId: 17843, val: 340_000_000 },
      { ship: 'Loki', shipId: 29990, val: 2_100_000_000 },
      { ship: 'Venture', shipId: 32880, val: 900_000 },
      { ship: 'Nyx', shipId: 23913, val: 24_000_000_000 },
    ];

    function randomKill() {
      const s = DEMO_SHIPS[Math.floor(Math.random() * DEMO_SHIPS.length)];
      return {
        ...s,
        shipImageUrl: `https://images.evetech.net/types/${s.shipId}/render?size=128`,
        isLoss: Math.random() < 0.4,
      };
    }

    function makeMockSocket() {
      const handlers = {};
      const api = {
        on(evt, fn) { (handlers[evt] ||= []).push(fn); return api; },
        push(evt, data) { (handlers[evt] || []).forEach(fn => fn(data)); },
      };
      return api;
    }

    // ---- wiring -------------------------------------------------------

    const socket = DEMO
      ? makeMockSocket()
      : io('https://ws.socketkill.com', {
          query: { character },
          transports: ['websocket']
        });

    socket.on('char-kill', renderKill);

    if (DEMO) {
      const rate = Number(params.get('rate') || 1500);
      socket.push('char-kill', randomKill());
      setInterval(() => socket.push('char-kill', randomKill()), rate);
    }
  </script>
</body>

</html>
