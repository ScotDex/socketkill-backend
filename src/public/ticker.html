<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #feed {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px;
  }
  .kill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.55);
    border-left: 3px solid #888;
    color: #e0e0e0;
    font-size: 15px;
    /* fade-in */
    animation: slide 0.3s ease-out;
  }
  .kill.loss { border-left-color: #ff6b6b; }
  .kill.kill { border-left-color: #51cf66; }
  .kill img { width: 32px; height: 32px; }
  .kill .ship { font-weight: bold; }
  .kill .val { margin-left: auto; color: #ffd43b; }
  @keyframes slide {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
  <div id="feed"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const MAX_ROWS = 12;
    const feed = document.getElementById('feed');
    const socket = io('https://ws.socketkill.com', { transports: ['websocket'] });

    socket.on('raw-kill', (k) => {
      const row = document.createElement('div');
      row.className = 'kill';
      row.innerHTML = `
        <img src="${k.shipImageUrl}" alt="">
        <span class="ship">${k.ship}</span>
        <span class="system">${k.system}</span>
        <span class="val">${k.val.toLocaleString()} ISK</span>
      `;
      feed.prepend(row);
      while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
    });
  </script>
</body>
</html>
