# Deploy path: .github/workflows/sde-sync.yml
#
# Runs daily at 07:00 UTC. Also manually triggerable from the Actions tab.
# Fetches the latest SDE from CCP, checks ETag + build number against the
# last-synced state stored in KV under sde:meta. If unchanged, exits.
# Otherwise: downloads, extracts, transforms, and writes to KV.

name: SDE Sync

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:      # Manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SDE sync
        run: node scripts/sde-sync/index.js

      - name: Summary
        if: always()
        run: |
          echo "Run completed. Check logs above for status." >> $GITHUB_STEP_SUMMARY